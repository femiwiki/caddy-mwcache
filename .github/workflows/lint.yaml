---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  caddy-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Format caddyfile
        run: |
          find . -name Caddyfile -o -name '*.Caddyfile' | while read -r CADDYFILE_PATH; do
            docker run --rm -v "$(dirname "$(realpath "$CADDYFILE_PATH")")":/srv caddy \
              caddy fmt --diff "/srv/$(basename "$CADDYFILE_PATH")"
          done

  rumdl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: rvben/rumdl@5606c5d6cbbfa8d61c2f23206d42aa6457ddd301  # v0.2.68
        with:
          version: 0.2.68

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv run --frozen --group lint yamllint --strict .

  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51  # v2.7.1
        with:
          version: latest
      - run: biome ci

  parallel-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: parallel-lint:1.4.0
          coverage: none
      - run: parallel-lint .
