---
version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocritic
    - gomoddirectives
    - goprintffuncname
    - gosec
    - iface
    - inamedparam
    - interfacebloat
    - intrange
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - recvcheck
    - revive
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    cyclop:
      # The most complex function in the tree is UnmarshalCaddyfile at 15.
      max-complexity: 15
    errcheck:
      exclude-functions:
        # Nothing can be reported to a client whose response already failed.
        - (net/http.ResponseWriter).Write
    funlen:
      # The longest non-test function is serveAndCache at 53 lines,
      # and the most statements are the 34 of parseRistrettoOptions.
      lines: 55
      statements: 35
    gocritic:
      disabled-checks:
        # The single case is the only backend implemented so far, not a typo.
        - singleCaseSwitch
    gosec:
      excludes:
        # errcheck reports unchecked errors, with the exclusion above.
        - G104
    govet:
      enable:
        - nilness
    misspell:
      locale: US
    recvcheck:
      exclusions:
        # Caddy registers modules by value.
        - "*.CaddyModule"
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Table-driven test cases are data, so their length says nothing.
      - path: _test\.go
        linters:
          - funlen
          - gocognit
      # Test fixtures repeat hosts on purpose and write throwaway files.
      - path: _test\.go
        linters:
          - dupword
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
